<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">校园金融安全雷达</title>
  <desc id="desc">由同心弧线、柔光网格和信号点组成的抽象金融安全雷达图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#082f2a"/>
      <stop offset=".52" stop-color="#0f6555"/>
      <stop offset="1" stop-color="#a7dca1"/>
    </linearGradient>
    <radialGradient id="beam" cx=".72" cy=".24" r=".72">
